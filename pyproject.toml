[project]
name = "oss4climate"
version = "0.13.2"
readme = "README.md"
description = "Package to create listings of Open Source for Energy"
authors = [
    { name = "Pierre V-F", email = "hello@pierrevf.com"}
]

requires-python = ">=3.14, <3.15"
dependencies = [
    "oss4x",
]
packages = [
    "src/oss4climate",
    "src/oss4climate_scripts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
scripts = [
    "black>=26.3.1",
    "ruff>=0.15.15",
    "oss4x[scripts]",
]
test = [
    "oss4x[test]",
]
app = [
    "fastapi>=0.136.1",
    "gunicorn>=23.0.0",
    "sentry-sdk[fastapi]>=2.61.1",
    "uvicorn[standard]>=0.42.0",
    "fastmcp>=3.2, <4",
    "oss4x[app]",
]
mcp = [
    "oss4x[mcp]",
]

[tool.uv.sources]
oss4x = { git = "https://github.com/Pierre-VF/oss4x.git" , tag="v_0.3.1"}

# scripts
[project.scripts]
add = "oss4climate_scripts.cli:add"
discover = "oss4climate_scripts.cli:discover"
# download_data = "oss4climate_scripts.cli:download_data"
format = "oss4climate_scripts.cli:format"
generate_listing = "oss4climate_scripts.cli:generate_listing"
publish = "oss4climate_scripts.cli:publish"
seed_typesense = "oss4climate.seed_typesense:seed"
reset_typesense = "oss4climate.seed_typesense:reset_and_seed"
